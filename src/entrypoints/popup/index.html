<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Force Dark/Light Mode</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --surface-color: #1e293b;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --brand-primary: #3b82f6;
        --brand-hover: #2563eb;
        --accent-dark: #6366f1;
        --accent-light: #f59e0b;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
      }
      .title {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .status-pill {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 9999px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .status-dark {
        background-color: #312e81;
        color: #a5b4fc;
      }
      .status-light {
        background-color: #451a03;
        color: #fde68a;
      }
      .status-system {
        background-color: #1e293b;
        color: #cbd5e1;
        border: 1px solid #475569;
      }
      .status-disabled {
        background-color: #3f3f46;
        color: #d4d4d8;
      }
      .card {
        background-color: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin: 0 0 6px 0;
      }
      .site-domain {
        font-size: 15px;
        font-weight: 600;
        word-break: break-all;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }
      button {
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: #273549;
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 600;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      button:hover {
        background-color: #334155;
        border-color: #475569;
      }
      button:focus-visible {
        outline: 2px solid var(--brand-primary);
        outline-offset: 1px;
      }
      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
      }
      select {
        background-color: #273549;
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      select:focus-visible {
        outline: 2px solid var(--brand-primary);
      }
      .footer {
        font-size: 11px;
        color: var(--text-secondary);
        text-align: center;
        margin-top: 8px;
      }
      kbd {
        background-color: #273549;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 2px 5px;
        font-family: monospace;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1 class="title">Force Dark/Light</h1>
        <span id="current-mode-badge" class="status-pill status-system">SYSTEM</span>
      </div>

      <div class="card">
        <div class="card-title">Current Website</div>
        <div class="site-domain">
          <span id="site-host">Loading...</span>
        </div>
        <div class="btn-group">
          <button id="btn-dark" type="button">🌙 Dark</button>
          <button id="btn-light" type="button">☀️ Light</button>
          <button id="btn-reset" type="button">↺ Reset</button>
        </div>
      </div>

      <div class="card">
        <div class="field-row">
          <label for="global-mode-select" class="card-title" style="margin: 0;">Global Mode</label>
          <select id="global-mode-select">
            <option value="system">Follow System</option>
            <option value="dark">Always Dark</option>
            <option value="light">Always Light</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
      </div>

      <div class="footer">
        <span>Shortcut: <kbd>Alt+Shift+D</kbd></span>
      </div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
