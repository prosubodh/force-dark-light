openapi: 3.1.0
info:
  title: Force Dark/Light Mode Extension Diagnostics & Health
  version: 1.0.0
  description: Diagnostic and health specification for extension host and background worker services.
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 OK if service worker and extension background contexts are healthy.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
  /readyz:
    get:
      summary: Readiness probe
      description: Returns 200 OK if extension storage and messaging ports are initialized.
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  storage:
                    type: string
                    example: connected
