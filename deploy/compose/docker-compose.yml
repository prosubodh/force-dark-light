services:
  extension-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/manifest.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
